<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- High-contrast rounded badge for tab visibility -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#bgGrad)" stroke="#c084fc" stroke-width="2" />

  <!-- Stylized Scissors & Video Cutter Icon (Crisp White with Shadow) -->
  <g filter="url(#glow)">
    <!-- Left loop -->
    <circle cx="21" cy="45" r="7" fill="none" stroke="#ffffff" stroke-width="3.5" />
    <!-- Right loop -->
    <circle cx="43" cy="45" r="7" fill="none" stroke="#ffffff" stroke-width="3.5" />

    <!-- Left blade cutting up-right -->
    <path d="M26 40 L45 19" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <!-- Right blade cutting up-left -->
    <path d="M38 40 L19 19" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />

    <!-- Center pivot rivet -->
    <circle cx="32" cy="34" r="2.5" fill="#facc15" />
  </g>

  <!-- Glowing AI Spark Star (Top Right) -->
  <path d="M48 6 Q48 14 56 14 Q48 14 48 22 Q48 14 40 14 Q48 14 48 6 Z" fill="url(#sparkGrad)" />
  <circle cx="48" cy="14" r="1.5" fill="#ffffff" />
</svg>
